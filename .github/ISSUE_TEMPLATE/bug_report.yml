name: 问题反馈
description: 报告软件异常或功能问题
title: "[问题] "
body:
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请写明实际发生的情况和你期望的结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开……\n2. 点击……\n3. 出现……"
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或补充说明
      description: 如有截图，可在这里添加；请遮盖 Token 等账号凭据。
