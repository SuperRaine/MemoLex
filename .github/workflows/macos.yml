name: Verify MemoLex 2.2.0 on Apple Silicon
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: e4e4045897079af7e744e77645d7c9e39090231b
    steps:
      - uses: actions/download-artifact@v8
        with:
          repository: SuperRaine/MemoLex
          run-id: 45637585863
          artifact-ids: 15035250828
          github-token: ${{ github.token }}
      - name: Verify the previously built arm64 app
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45637585863 --jq .head_sha)" = "$RELEASE_SHA"
          DMG=MemoLex-2.2.0-macOS-universal.dmg
          hdiutil verify "$DMG"
          ditto -x -k MemoLex-2.2.0-macOS-universal.zip app
          APP="$PWD/app/MemoLex.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" | grep -Fx 2.2.0
          codesign --verify --deep --strict "$APP"
          lipo "$APP/Contents/MacOS/MemoLex" -verify_arch x86_64 arm64
          MEMOLEX_RESOURCES="$APP/Contents/Resources" MEMOLEX_PROFILE="$RUNNER_TEMP/MemoLex-profile" "$APP/Contents/Resources/Core-arm64/MemoLex.Core" --smoke-test
          "$APP/Contents/MacOS/MemoLex" &
          PID=$!
          sleep 20
          kill -0 "$PID"
          kill "$PID"
      - name: Attach and confirm the original artifact
        shell: bash
        run: |
          file=MemoLex-2.2.0-macOS-universal.dmg
          digest="sha256:$(shasum -a 256 "$file" | cut -d' ' -f1)"
          get_release() { gh release view v2.2.0 --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets; }
          release="$(get_release)"
          jq -e --arg sha "$RELEASE_SHA" '.isDraft and .targetCommitish == $sha' <<< "$release"
          if ! jq -e --arg name "$file" '.assets | any(.name == $name)' <<< "$release"; then
            gh release upload v2.2.0 "$file" --repo "$GITHUB_REPOSITORY" || true
          fi
          get_release | jq -e --arg name "$file" --arg digest "$digest" '.assets | any(.name == $name and .digest == $digest)'