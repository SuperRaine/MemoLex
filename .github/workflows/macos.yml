name: Build macOS 1.8
on:
  workflow_dispatch:
  push:
    branches: [macos-1.8.0, main]
    paths: ['macos/**', 'src/Core/**', 'src/Services/**', '.github/workflows/macos.yml']
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.416
      - name: Prepare bundled translation provider
        env:
          PROVIDER_KEY: ${{ secrets.MEMOLEX_DEEPL_KEY }}
        run: |
          if [ -n "$PROVIDER_KEY" ]; then
            mkdir -p src/Private
            printf '%s' "$PROVIDER_KEY" > src/Private/DeepL.key
          fi
      - name: Build universal app and packages
        run: bash macos/build.sh
      - name: Upload Mac packages
        uses: actions/upload-artifact@v7
        with:
          name: MemoLex-1.8.0-macOS
          path: |
            macos/output/*.zip
            macos/output/*.dmg
          compression-level: 0
          retention-days: 14
  intel:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MemoLex-1.8.0-macOS
      - name: Verify Intel bundle and offline core
        run: |
          ditto -x -k MemoLex-1.8.0-macOS-universal.zip app
          APP="$PWD/app/MemoLex.app"
          codesign --verify --deep --strict "$APP"
          lipo -verify_arch x86_64 arm64 "$APP/Contents/MacOS/MemoLex"
          MEMOLEX_RESOURCES="$APP/Contents/Resources" MEMOLEX_PROFILE="$RUNNER_TEMP/MemoLex-profile" "$APP/Contents/Resources/Core-x64/MemoLex.Core" --smoke-test
          "$APP/Contents/MacOS/MemoLex" &
          PID=$!
          sleep 20
          kill -0 "$PID"
          kill "$PID"
