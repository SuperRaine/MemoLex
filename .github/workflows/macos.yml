name: Build macOS 1.8
on:
  workflow_dispatch:
  push:
    branches: [macos-1.8.0, macos-1.8.1-check, main]
    paths: ['macos/**', 'src/Core/**', 'src/Services/**', '.github/workflows/macos.yml']
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.416
      - name: Prepare bundled translation provider
        env:
          PROVIDER_KEY: ${{ secrets.MEMOLEX_DEEPL_KEY }}
        run: |
          if [ -n "$PROVIDER_KEY" ]; then
            mkdir -p src/Private
            printf '%s' "$PROVIDER_KEY" > src/Private/DeepL.key
          fi
      - name: Build universal app and packages
        env:
          MEMOLEX_VERIFY_ONLY: ${{ github.ref_name == 'macos-1.8.1-check' && '1' || '0' }}
        run: bash macos/build.sh
      - name: Upload Mac packages
        uses: actions/upload-artifact@v7
        with:
          name: MemoLex-1.8.0-macOS
          path: |
            macos/output/*.zip
            macos/output/*.dmg
          compression-level: 0
          retention-days: 14
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MemoLex-1.8.0-macOS
      - name: Verify native bundle and offline core
        run: |
          ditto -x -k MemoLex-*-macOS-universal.zip app
          APP="$PWD/app/MemoLex.app"
          codesign --verify --deep --strict "$APP"
          lipo "$APP/Contents/MacOS/MemoLex" -verify_arch x86_64 arm64
          ARCH="$(uname -m)"; [ "$ARCH" != x86_64 ] || ARCH=x64
          MEMOLEX_RESOURCES="$APP/Contents/Resources" MEMOLEX_PROFILE="$RUNNER_TEMP/MemoLex-profile" "$APP/Contents/Resources/Core-$ARCH/MemoLex.Core" --smoke-test
          "$APP/Contents/MacOS/MemoLex" &
          PID=$!
          sleep 20
          kill -0 "$PID"
          screencapture -x "$RUNNER_TEMP/MemoLex-preview.png" || true
          kill "$PID"
      - name: Preserve native window preview
        uses: actions/upload-artifact@v7
        with:
          name: Native-preview-${{ matrix.os }}
          path: ${{ runner.temp }}/MemoLex-preview.png
          if-no-files-found: ignore
          retention-days: 2
