name: Publish verified Mac packages
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Build macOS 1.8 run ID
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: SuperRaine/MemoLex
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - name: Check the verified build
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/build.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP'])/'build.json').read_text())
          assert run['conclusion'] == 'success' and run['name'] == 'Build macOS 1.8'
          assert run['repository']['full_name'] == 'SuperRaine/MemoLex'
          assert run['path'] == '.github/workflows/macos.yml'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SOURCE_COMMIT=' + run['head_sha'] + '\n')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: MemoLex-1.8.0-macOS
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Check package contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, plistlib, zipfile, json
          archive = Path('MemoLex-1.8.0-macOS-universal.zip')
          disk = Path('MemoLex-1.8.0-macOS-universal.dmg')
          assert archive.is_file() and disk.is_file()
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None
              names = package.namelist()
              assert all(name.startswith(('MemoLex.app/', '__MACOSX/')) for name in names)
              info = plistlib.loads(package.read('MemoLex.app/Contents/Info.plist'))
              assert info['CFBundleIdentifier'] == 'com.superraine.MemoLex'
              assert info['CFBundleShortVersionString'] == '1.8.0'
              for arch in ('arm64', 'x64'):
                  assert package.getinfo(f'MemoLex.app/Contents/Resources/Core-{arch}/MemoLex.Core').file_size > 10000000
              assert 'MemoLex.app/Contents/Resources/data/dictionary.index.tsv' in names
              assert 'MemoLex.app/Contents/Resources/data/mnemonics.json' in names
          manifest = {p.name: {'size':p.stat().st_size, 'digest':'sha256:'+hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()} for p in (archive, disk)}
          Path('local-manifest.json').write_text(json.dumps(manifest))
          print(json.dumps(manifest))
          PY
      - name: Add Mac packages to version 1.8
        run: |
          gh release view v1.8.0 --json assets > existing-assets.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          current = json.loads(Path('existing-assets.json').read_text())['assets']
          local = json.loads(Path('local-manifest.json').read_text())
          pending = []
          for name, item in local.items():
              existing = next((x for x in current if x['name'] == name), None)
              if existing is None: pending.append(name)
              else: assert existing['size'] == item['size'] and existing['digest'] == item['digest'], 'A different package already exists: '+name
          Path('pending.txt').write_text('\n'.join(pending))
          PY
          while IFS= read -r FILE || [ -n "$FILE" ]; do
            [ -z "$FILE" ] || gh release upload v1.8.0 "$FILE"
          done < pending.txt
          if ! gh api "repos/$GH_REPO/git/ref/tags/macOS-1.8.0" > tag.json 2>/dev/null; then
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/macOS-1.8.0 -f sha="$SOURCE_COMMIT" > tag.json
          fi
          test "$(python3 -c 'import json; print(json.load(open("tag.json"))["object"]["sha"])')" = "$SOURCE_COMMIT"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          - 新增 Mac 版，支持 Apple Silicon 和 Intel。
          - 顽固单词支持排序、轮换和遮住释义自测。
          - 优化界面布局、小窗口体验、更新与卸载。

          **Windows**：安装版下载 `.msi`；便携版完整解压后运行 `MemoLex.exe`。

          **Mac**：下载 `.dmg`，打开后将 App 拖到「应用程序」；也可下载 Mac ZIP 包。已包含运行环境、离线词库和本地助记。[Mac 使用说明](https://github.com/SuperRaine/MemoLex/blob/main/macos/使用说明.md)

          [备用下载](https://gh-proxy.com/https://github.com/SuperRaine/MemoLex/releases/tag/v1.8.0) · [Mac 源码](https://github.com/SuperRaine/MemoLex/tree/macOS-1.8.0)

          本软件为个人开发的非官方工具，与「墨墨背单词」无隶属关系。
          NOTES
          gh release edit v1.8.0 --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Confirm published files
        run: |
          gh release view v1.8.0 --json assets > published-assets.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          assets = json.loads(Path('published-assets.json').read_text())['assets']
          local = json.loads(Path('local-manifest.json').read_text())
          assert len(assets) == 4
          for name, item in local.items():
              remote = next(x for x in assets if x['name'] == name)
              assert remote['size'] == item['size'] and remote['digest'] == item['digest'] and remote['state'] == 'uploaded'
          print('Mac packages published and verified; Windows assets retained.')
          PY
